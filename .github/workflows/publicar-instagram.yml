name: Publicar en Instagram (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install anthropic feedparser Pillow numpy

      - name: Buscar @global.patagonia (solo lectura, no publica)
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          python3 - <<'EOF'
          import os, sys, json, urllib.request, urllib.parse
          sys.path.insert(0, '.')
          import actualizar_noticias as an

          token = os.environ.get("FACEBOOK_PAGE_TOKEN", "")
          nuevo, page_id = an._renovar_token_facebook(token)
          ig_id = os.environ.get("INSTAGRAM_BUSINESS_ACCOUNT_ID", "")

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"HTTPError": e.code, "body": e.read().decode("utf-8", errors="replace")}

          fields = urllib.parse.quote("business_discovery.username(global.patagonia){username,name,biography,followers_count,profile_picture_url}")
          r = get(f"https://graph.facebook.com/v21.0/{ig_id}?fields={fields}&access_token={nuevo}")
          print("Búsqueda de @global.patagonia vía business_discovery:", json.dumps(r, ensure_ascii=False))
          EOF

