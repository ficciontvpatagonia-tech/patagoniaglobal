name: Actualizar Noticias

on:
  schedule:
    - cron: '0 9 * * *'    # Todos los días a las 6:00 AM hora Argentina (UTC-3)
  workflow_dispatch:        # También disponible manual desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install anthropic feedparser Pillow numpy pytrends

      - name: Correr script de noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python3 actualizar_noticias.py

      - name: Agregar relacionadas y compartir a notas nuevas
        run: |
          python3 agregar_relacionadas.py
          python3 agregar_compartir.py

      - name: Inyectar tapa forzada (si existe)
        run: |
          python3 - <<'EOF'
          import json, os
          if os.path.exists('tapa_forzada.json'):
              with open('noticias.json', encoding='utf-8') as f:
                  data = json.load(f)
              with open('tapa_forzada.json', encoding='utf-8') as f:
                  data['tapa'] = json.load(f)
              with open('noticias.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              os.remove('tapa_forzada.json')
              print('Tapa forzada inyectada y archivo eliminado.')
          else:
              print('Sin tapa forzada, continuando con tapa generada.')
          if os.path.exists('secundaria_forzada.json'):
              with open('noticias.json', encoding='utf-8') as f:
                  data = json.load(f)
              with open('secundaria_forzada.json', encoding='utf-8') as f:
                  data['secundarias'][0] = json.load(f)
              with open('noticias.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              os.remove('secundaria_forzada.json')
              print('Secundaria forzada inyectada y archivo eliminado.')
          else:
              print('Sin secundaria forzada, continuando con secundarias generadas.')
          # Deduplicar noticias[] — quitar lo que ya está en tapa o secundarias
          with open('noticias.json', encoding='utf-8') as f:
              datos = json.load(f)
          excluir = {datos['tapa']['id']} | {s['id'] for s in datos.get('secundarias', [])}
          datos['noticias'] = [n for n in datos.get('noticias', []) if n['id'] not in excluir]
          with open('noticias.json', 'w', encoding='utf-8') as f:
              json.dump(datos, f, ensure_ascii=False, indent=2)
          # Re-inyectar index.html con el noticias.json ya parcheado
          import sys
          sys.path.insert(0, '.')
          import actualizar_noticias
          actualizar_noticias.inyectar_tapa_en_index(datos)
          EOF

      - name: Generar News Sitemap
        run: python3 generar_sitemap_news.py

      - name: Publicar cambios
        run: |
          git config user.name "GLOBALpatagonia Bot"
          git config user.email "bot@globalpatagonia.org"
          git add noticias.json noticias_ayer.json historial.json agenda.json index.html fotos/ propios.json propios_historial.json deportes_feed.json negocios.json turismo.json cultura.json telegram_state.json sitemap.xml sitemap-news.xml feed.xml urls_publicadas.json
          git add archivo/ 2>/dev/null || true   # respaldo de notas viejas que salen del historial (no falla si está vacío)
          git add tapa_forzada.json secundaria_forzada.json 2>/dev/null || true
          git ls-files --others --exclude-standard notas/ | xargs -r git add --
          git add notas/
          git diff --staged --quiet || git commit -m "Noticias actualizadas — $(date +'%d/%m/%Y')"
          git push

      - name: Validar SEO páginas raíz
        run: |
          python3 - <<'PYEOF'
          import os
          EXCLUDE = {
              'nota.html', 'guia.html', '404.html', 'index.html',
          }
          warns = []
          with open('sitemap.xml', encoding='utf-8') as f:
              sitemap = f.read()
          for fname in sorted(os.listdir('.')):
              if not fname.endswith('.html') or not os.path.isfile(fname):
                  continue
              if fname in EXCLUDE:
                  continue
              try:
                  head = open(fname, encoding='utf-8').read(20000)
              except Exception:
                  continue
              if 'noindex' in head:
                  continue
              url = f'https://globalpatagonia.org/{fname}'
              if url not in sitemap:
                  warns.append(f'::warning file={fname}::{fname} es pública pero no está en sitemap.xml — agregar a _PAGE_CONFIG en actualizar_noticias.py')
              if 'rel="canonical"' not in head and "rel='canonical'" not in head:
                  warns.append(f'::warning file={fname}::{fname} no tiene etiqueta canonical')
              if 'clima.html' not in head:
                  warns.append(f'::warning file={fname}::{fname} no tiene link a clima.html en el nav')
          for w in warns:
              print(w)
          if not warns:
              print('✅ SEO raíz: todas las páginas públicas están en el sitemap, tienen canonical y link a clima.html')
          PYEOF

      - name: Enviar URLs a IndexNow (Bing/Yandex)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 submit_indexnow.py

      - name: Verificar PageSpeed (Mobile)
        run: |
          SCORE=$(curl -sf "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https://globalpatagonia.org&strategy=mobile" | python3 -c "import sys,json; d=json.load(sys.stdin); print(int(d['lighthouseResult']['categories']['performance']['score']*100))" 2>/dev/null || echo "N/A")
          echo "PageSpeed mobile: $SCORE/100"
          if [ "$SCORE" != "N/A" ] && [ "$SCORE" -lt 60 ] 2>/dev/null; then
            echo "::warning::PageSpeed mobile degradado: $SCORE/100"
          fi

      - name: Esperar propagación GitHub Pages
        run: sleep 90

      - name: Publicar tapa e informes en Instagram
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python3 actualizar_noticias.py --solo-instagram

      - name: Guardar estado Instagram
        run: |
          git config user.name "GLOBALpatagonia Bot"
          git config user.email "bot@globalpatagonia.org"
          git add telegram_state.json
          git diff --staged --quiet || git commit -m "Estado Instagram — $(date +'%d/%m/%Y')"
          git push
