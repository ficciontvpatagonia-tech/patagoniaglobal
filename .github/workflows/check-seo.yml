name: Auditoría SEO Semanal

on:
  schedule:
    - cron: '0 12 * * 1'   # Lunes 9:00 AM hora Argentina (UTC-3)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  auditoria:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr auditoría SEO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 _scripts/check_seo.py   # movido a _scripts/ en la reorg del 31/05
