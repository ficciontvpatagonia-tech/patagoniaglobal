<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada — GLOBALpatagonia</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --verde: #1c2d3d; --azul-claro: #8ab8d4; --gris-oscuro: #252830; --gris-medio: #5a6070; --crema: #f0ede8; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--crema);
      color: var(--gris-oscuro);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px 20px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: var(--verde); margin-bottom: 8px; }
    .logo span { color: var(--azul-claro); font-weight: 400; font-style: italic; }
    .code { font-family: 'Playfair Display', serif; font-size: 96px; font-weight: 900; color: var(--azul-claro); line-height: 1; margin: 32px 0 16px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--gris-oscuro); margin-bottom: 16px; }
    p { font-size: 16px; color: var(--gris-medio); max-width: 480px; line-height: 1.7; margin-bottom: 32px; }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--verde);
      color: white;
      text-decoration: none;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .home-link:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="logo"><span>global</span>PATAGONIA</div>
  <div class="code">404</div>
  <h1>Página no encontrada</h1>
  <p>La nota o página que buscás puede haber sido movida, archivada o no existe. Todas las noticias recientes están disponibles en la portada.</p>
  <a href="/" class="home-link">← Volver a la portada</a>
</body>
</html>
