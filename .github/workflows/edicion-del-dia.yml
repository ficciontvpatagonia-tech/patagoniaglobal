name: Edición del día (PDF a Telegram y descarga)

on:
  workflow_run:
    workflows: ["Actualizar Noticias"]
    types: [completed]
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Generar aunque noticias.json no sea de hoy'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'si'
      telegram:
        description: '¿Mandar también a Telegram?'
        required: true
        default: 'si'
        type: choice
        options:
          - 'si'
          - 'no'

permissions:
  contents: write   # para actualizar el archivo de la release «edicion-del-dia»

jobs:
  edicion:
    # Solo si el Action de noticias terminó bien (o si se lanza a mano)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install reportlab Pillow pymupdf

      - name: Generar PDF (y mandarlo a Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          OPC="--salida GLOBALpatagonia-edicion-del-dia.pdf"
          if [ "${{ github.event.inputs.forzar }}" = "si" ]; then OPC="$OPC --forzar"; fi
          if [ "${{ github.event.inputs.telegram }}" = "no" ]; then OPC="$OPC --no-enviar"; fi
          python3 _scripts/enviar_edicion_telegram.py $OPC

      # Imagen de la portada (página 1): para subir al canal de WhatsApp, que no admite documentos
      - name: Imagen de portada para WhatsApp
        if: hashFiles('GLOBALpatagonia-edicion-del-dia.pdf') != ''
        run: |
          python3 - <<'PY'
          import fitz
          doc = fitz.open("GLOBALpatagonia-edicion-del-dia.pdf")
          doc[0].get_pixmap(dpi=130).save("portada-del-dia.jpg", jpg_quality=82)
          PY

      # El PDF NO se commitea al repo (cada día sumaría peso al historial):
      # se guarda como archivo de una release fija, que se pisa todos los días.
      - name: Actualizar la descarga fija (release)
        if: hashFiles('GLOBALpatagonia-edicion-del-dia.pdf') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edicion-del-dia >/dev/null 2>&1 || \
            gh release create edicion-del-dia --title "Edición del día (PDF)" \
              --notes "Última edición del día de GLOBALpatagonia. Se actualiza solo cada mañana."
          gh release upload edicion-del-dia GLOBALpatagonia-edicion-del-dia.pdf portada-del-dia.jpg --clobber
