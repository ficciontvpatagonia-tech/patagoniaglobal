name: Probar clave Anthropic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install anthropic Pillow numpy feedparser openai
      - name: Probar visión
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request
          sys.path.insert(0, ".")
          import actualizar_noticias as A
          u = "https://www.tiemposur.com.ar/uploads/noticia_galeria/2026/10/14/file_259786_zocalo801.jpg"
          data = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})).read()
          r = A._foto_sin_marca_ajena(data)
          print("RESULTADO tiemposur:", r)
          if r and r["marcas"]:
              print("RECORTE:", A._recorte_minimo((800, 421), r["marcas"]))
          PY
